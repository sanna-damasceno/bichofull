name: CI - BichoFull

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x backend/mvnw

      - name: Build and Test backend
        run: |
          cd backend
          ./mvnw clean install -Dspring.profiles.active=test

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm' 
          cache-dependency-path: bichofull-frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd bichofull-frontend
          npm ci

      - name: Run linter
        run: |
          cd bichofull-frontend
          npm run lint || echo "Linter com avisos, mas continuando..."
      
      - name: Build frontend
        run: |
          cd bichofull-frontend
          npm run build