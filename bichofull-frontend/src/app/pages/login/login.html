<div class="login-page">
  <div class="login-container">
    <div class="banner-side">
      <div class="badge">Jogos online · Sorteios rápidos</div>
      <h1>Entre e faça sua aposta!</h1>
    </div>

    <div class="form-side">
      <div class="form-header">
        <h2>Bem-vindo de volta!</h2>
        <p>Acesse sua conta para continuar jogando no BichoFull.</p>
      </div>

      <div class="input-group">
        <label>E-mail</label>
        <input type="email" placeholder="seu@email.com" [(ngModel)]="email" />
      </div>

      <div class="input-group">
        <label>Senha</label>
        <div class="password-wrapper">
          <input type="password" placeholder="••••••••" [(ngModel)]="password" />
          <span class="material-symbols-rounded eye-icon">visibility</span>
        </div>
        <a href="#" class="forgot-password">Esqueci minha senha</a>
      </div>

      <button class="btn-login" (click)="login()">Entrar na conta</button>

      <p class="signup-text">
        Ainda não tem uma conta? <a routerLink="/register">Cadastrar agora</a>
      </p>
    </div>
  </div>
</div>
