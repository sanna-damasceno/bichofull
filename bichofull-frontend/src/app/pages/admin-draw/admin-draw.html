<div style="display: flex; justify-content: space-between; align-items: center;">
  <h2>Admin - Sorteio</h2>
  <button (click)="logout()">Sair</button>
</div>
<!-- SORTEIO AUTOMÁTICO -->
<button (click)="runDraw()" [disabled]="loading()">
  {{ loading() ? 'Executando...' : 'Executar Sorteio' }}
</button>

<hr>

<!-- SORTEIO MANUAL -->
<h3>Criar Sorteio Manual</h3>

<div>
  <input placeholder="1º prêmio" [(ngModel)]="manualDraw.firstPrize">
  <input placeholder="2º prêmio" [(ngModel)]="manualDraw.secondPrize">
  <input placeholder="3º prêmio" [(ngModel)]="manualDraw.thirdPrize">
  <input placeholder="4º prêmio" [(ngModel)]="manualDraw.fourthPrize">
  <input placeholder="5º prêmio" [(ngModel)]="manualDraw.fifthPrize">
</div>

<button (click)="createManualDraw()" [disabled]="loading()">
  Criar Sorteio Manual
</button>

<!-- loading -->
<p *ngIf="loading()">⏳ Processando...</p>

<!-- sucesso -->
<p *ngIf="success()">✅ Operação realizada com sucesso!</p>

<div *ngIf="result() as r">
  <h3>Resultado:</h3>
  <p>1º: {{ r.firstPrize }}</p>
  <p>2º: {{ r.secondPrize }}</p>
  <p>3º: {{ r.thirdPrize }}</p>
  <p>4º: {{ r.fourthPrize }}</p>
  <p>5º: {{ r.fifthPrize }}</p>
</div>
