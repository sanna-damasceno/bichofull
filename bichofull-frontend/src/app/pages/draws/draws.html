<h2>Sorteios</h2>

<div class="top-container">

  <!-- reutiliza -->
  <app-next-draw></app-next-draw>

  <!-- reutiliza -->
  <app-draw-history></app-draw-history>

</div>

<!-- Histórico -->
<div class="history">
  <h3>Histórico de Sorteios</h3>

  <table>
    <thead>
      <tr>
        <th>Data</th>
        <th>1º</th>
        <th>2º</th>
        <th>3º</th>
        <th>4º</th>
        <th>5º</th>
      </tr>
    </thead>

    <tbody>
      @for (d of history(); track d.id) {
        <tr>
          <td>{{ d.drawDate | date:'dd/MM HH:mm' }}</td>
          <td>{{ d.firstPrize }}</td>
          <td>{{ d.secondPrize }}</td>
          <td>{{ d.thirdPrize }}</td>
          <td>{{ d.fourthPrize }}</td>
          <td>{{ d.fifthPrize }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
