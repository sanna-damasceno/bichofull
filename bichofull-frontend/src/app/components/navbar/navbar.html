<nav class="navbar-container">
  <div class="logo">Bicho<span>Full</span></div>

  <button class="menu-toggle" (click)="toggleMenu()">
    <span class="material-symbols-rounded">
      {{ isMenuOpen() ? 'close' : 'menu' }}
    </span>
  </button>
  
  <ul class="nav-menu" [class.open]="isMenuOpen()">
    <li>
      <a routerLink="/dashboard" routerLinkActive="active" (click)="closeMenu()">Apostar</a>
    </li>
    <li>
      <a routerLink="/bet-history" routerLinkActive="active" (click)="closeMenu()">Histórico de Apostas</a>
    </li>
    <li>
      <a routerLink="/draws" routerLinkActive="active" (click)="closeMenu()">Sorteios</a>
    </li>
    <li>
      <a routerLink="/how-it-works" routerLinkActive="active" (click)="closeMenu()">Como Jogar</a>
    </li>

    <li class="mobile-logout">
      <button (click)="logout(); closeMenu()" class="logout-link">
        <span class="material-symbols-rounded">logout</span> Sair
      </button>
    </li>
  </ul>

  <div class="user-section">
    <div class="profile-info">
      @if (user(); as currentUser) {
        <span>
          Olá,<br>
          {{ currentUser.name ? currentUser.name.split(' ')[0] : 'Usuário' }}
        </span>
      } @else {
        <span>Olá,<br>...</span>
      }
    </div> <button (click)="logout()" class="logout-btn">
      <span class="material-symbols-rounded">logout</span>
    </button>
  </div> 
</nav>

@if (isMenuOpen()) {
  <div class="menu-overlay" (click)="closeMenu()"></div>
}
