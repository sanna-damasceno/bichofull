<div class="animal-grid">
  <div 
    class="animal-card" 
    *ngFor="let animal of animals()" 
    (click)="selectAnimal(animal)"
  >
    <div class="animal-id">{{ animal.groupNumber }}</div>
    <strong>{{ animal.name }}</strong>

    <div class="dezenas">
      {{ animal.dezenas }}
    </div>
  </div>
</div>
