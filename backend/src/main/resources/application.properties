spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

spring.sql.init.encoding=UTF-8

spring.sql.init.mode=always

# Adicione estas linhas para o Swagger não se perder no Docker
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.writer-with-default-pretty-printer=true

springdoc.cache.disabled=true

# Garanta que o Spring não tente validar o Swagger com JWT
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

spring.datasource.url=jdbc:mysql://mysql:3306/bicho_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.show-sql=true
